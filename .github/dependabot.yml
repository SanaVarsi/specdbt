version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml/release.yml current -- Dependabot
  # bumps the pin and refreshes the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # uv.lock + pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
