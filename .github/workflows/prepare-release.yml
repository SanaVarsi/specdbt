name: Prepare Release

# One-click release: Actions tab -> this workflow -> Run workflow -> pick a
# bump (or type an exact version) -> it tags + opens the GitHub Release.
# That publish event triggers release.yml, which reruns CI, builds, and
# pauses on the "pypi" environment for manual approval before anything
# reaches PyPI -- this workflow only ever gets you to that approval gate,
# never past it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version to release instead, e.g. 1.2.0 (optional)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag + GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need full tag history to find the latest release

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            next="${{ inputs.version }}"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            latest="${latest#v}"
            latest="${latest:-0.0.0}"
            IFS='.' read -r major minor patch <<< "$latest"
            case "${{ inputs.bump }}" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "tag v$next already exists" >&2
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Tag + publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "specdbt v$NEXT"
          git push origin "v$NEXT"
          gh release create "v$NEXT" \
            --title "v$NEXT" \
            --generate-notes \
            --repo "${{ github.repository }}"
