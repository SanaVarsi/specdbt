name: Release

# Trusted publishing to PyPI (OIDC, no API token secret). This requires a
# one-time setup that only happens once the repo exists on GitHub:
#   1. On pypi.org, add a *pending* trusted publisher for project "specdbt"
#      naming this owner/repo, workflow filename "release.yml", and
#      environment "pypi" -- exactly, all three are load-bearing.
#   2. Create a GitHub Environment named "pypi" on this repo.
#   3. Trigger the "Prepare Release" workflow (Actions tab -> Run
#      workflow) -- it tags, opens the GitHub Release, and calls this
#      workflow directly in the same run. A release created by hand
#      through the GitHub UI also triggers this via `release: published`
#      as a fallback, but the default GITHUB_TOKEN a workflow uses to
#      create a release can't fire that event itself (anti-loop
#      protection), which is why Prepare Release calls in rather than
#      relying on the event.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: "vX.Y.Z's X.Y.Z, when called directly instead of via a release event"
        required: false
        type: string

# Least-privilege default; jobs escalate only what they individually need.
permissions:
  contents: read

jobs:
  # Reruns the same suite ci.yml runs on every push/PR -- a merged, green
  # commit doesn't guarantee the exact tagged ref is still green, and this
  # is the last gate before an irreversible PyPI upload.
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # ci.yml's gitleaks job needs pull-requests: read for its own scan --
    # a called workflow can't exceed what the caller grants it here.
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history + tags -- hatch-vcs derives the package version from
      # the tag that triggered this release; a shallow checkout can't see
      # it. Pin explicitly to the tag when called directly (inputs.version
      # set) so a commit landing on main between tagging and this checkout
      # can't slip in ahead of the release it's building.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.25"

      - name: Build sdist + wheel
        run: uv build

      - name: Built version matches release tag
        # Catches hatch-vcs silently falling back to a dev version (e.g.
        # the tag wasn't actually visible to the checkout above) before
        # it reaches PyPI -- the one thing the old hand-written version
        # field let us check directly. sdist filename is specdbt-X.Y.Z.tar.gz.
        # "inputs.version" is set when Prepare Release calls this workflow
        # directly; GITHUB_REF_NAME is a real "vX.Y.Z" tag only when this
        # ran from an actual release event instead.
        env:
          CALLED_VERSION: ${{ inputs.version }}
        run: |
          tag="${CALLED_VERSION:-${GITHUB_REF_NAME#v}}"
          built="$(basename dist/specdbt-*.tar.gz .tar.gz | sed 's/^specdbt-//')"
          if [ "$tag" != "$built" ]; then
            echo "release tag v$tag does not match built version $built"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for trusted publishing -- no token secret needed
      contents: read
      attestations: write # PEP 740 build provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
