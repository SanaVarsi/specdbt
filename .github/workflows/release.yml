name: Release

# Trusted publishing to PyPI (OIDC, no API token secret). This requires a
# one-time setup that only happens once the repo exists on GitHub:
#   1. On pypi.org, add a *pending* trusted publisher for project "specdbt"
#      naming this owner/repo, workflow filename "release.yml", and
#      environment "pypi" -- exactly, all three are load-bearing.
#   2. Create a GitHub Environment named "pypi" on this repo.
#   3. Tag a commit `vX.Y.Z` matching pyproject.toml's `version`, then
#      publish a GitHub Release from that tag (or push the tag, if using
#      the tag-push trigger below).
on:
  release:
    types: [published]

# Least-privilege default; jobs escalate only what they individually need.
permissions:
  contents: read

jobs:
  # Reruns the same suite ci.yml runs on every push/PR -- a merged, green
  # commit doesn't guarantee the exact tagged ref is still green, and this
  # is the last gate before an irreversible PyPI upload.
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # ci.yml's gitleaks job needs pull-requests: read for its own scan --
    # a called workflow can't exceed what the caller grants it here.
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$ver" ]; then
            echo "release tag v$tag does not match pyproject.toml version $ver"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.25"

      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for trusted publishing -- no token secret needed
      contents: read
      attestations: write # PEP 740 build provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
