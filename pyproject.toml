[project]
name = "specdbt"
version = "0.1.0"
description = "BDD-style Given/When/Then testing for dbt models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "gherkin-official>=42.0.1",
    "click>=8.4.2",
    "dbt-core>=1.9,<2.0.0",
    "dbt-duckdb>=1.9",
    "polars>=1.20",
    "pyyaml>=6.0",
    "sqlparse>=0.6.0",
]

[project.scripts]
specdbt = "specdbt.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "dbt-postgres>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdbt"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds prose specs/plans, not source -- ruff 0.16+ formats embedded
# Python fences in Markdown by default, which would rewrite illustrative
# code blocks in plan docs to match live-source style rules that don't
# apply to them.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
