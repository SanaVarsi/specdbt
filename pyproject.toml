[project]
name = "specdbt"
dynamic = ["version"]
description = "BDD-style Given/When/Then testing for dbt models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SanaVarsi" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "gherkin-official>=42.0.1",
    "click>=8.4.2",
    "dbt-core>=1.9,<2.0.0",
    "dbt-duckdb>=1.9",
    "polars>=1.20",
    "pyyaml>=6.0",
    "sqlparse>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/SanaVarsi/specdbt"
Repository = "https://github.com/SanaVarsi/specdbt"

# Extra dbt adapter packages for running specdbt against a warehouse other
# than the DuckDB bundled in `dependencies` -- pick the one matching your
# dbt project, e.g. `uv add --dev "specdbt[databricks]"`.
[project.optional-dependencies]
postgres = ["dbt-postgres>=1.9"]
databricks = ["dbt-databricks>=1.9"]
snowflake = ["dbt-snowflake>=1.9"]

[project.scripts]
specdbt = "specdbt.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "dbt-postgres>=1.9",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdbt"]

# Version comes from the git tag (vX.Y.Z -> X.Y.Z), not a hand-edited
# field here -- the tag is the single source of truth, nothing to keep
# in sync. An untagged/dev checkout gets a PEP 440 dev version instead
# of failing the build.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds prose specs/plans, not source -- ruff 0.16+ formats embedded
# Python fences in Markdown by default, which would rewrite illustrative
# code blocks in plan docs to match live-source style rules that don't
# apply to them.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
